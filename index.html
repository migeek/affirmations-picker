<!doctype html>
<!--
  MyAffirmations — Google Doc picker (see .kiro/specs/google-docs/design.md).
  The app opens this page in a browser tab with a short-lived Drive access token in the URL
  fragment (fragments are never sent to a server):
    #token=<token>&mode=doc|folder[&parent=<folderId>&parentName=<name>]
  It shows Google Picker — mode=doc: browse folders from My Drive (or Recently picked) and pick
  a Google Doc (import); mode=folder: pick a folder to save an export in (tabs: the remembered
  folder [parent], by name, and My Drive). The pick is granted to the app's
  Google Cloud project (setAppId) under the app's `drive.file` permission, then the page hands
  it back to the app:
    com.migeek.affirmations://picked?id=<id>&name=<name>&parent=<folder it is in>
  (or ?cancelled=1)
  Published on GitHub Pages (the app repo is private). API_KEY is restricted to the Picker
  API and this page's origin, so it is not a secret.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a Google Doc</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #1b1b1b; background: #fff; }
    a.button { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 20px;
               background: #1E6F66; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <p id="msg">Opening Google Drive…</p>
  <p><a id="back" class="button" hidden>Back to MyAffirmations</a></p>
  <script>
    const API_KEY = 'AIzaSyApfx-OZThTYO5KQ42W03sS43-wH87vzJ8';
    const APP_ID = '924160936244';
    const RETURN_TO = 'com.migeek.affirmations://picked';

    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('token');
    const mode = params.get('mode') === 'folder' ? 'folder' : 'doc';
    const parent = params.get('parent') || 'root'; // remembered folder
    const parentName = params.get('parentName') || 'Last folder';
    // Don't leave the token in the address bar or history.
    history.replaceState(null, '', location.pathname);

    function say(text) { document.getElementById('msg').textContent = text; }

    // Hand the result back to the app. A button too, in case the browser
    // blocks the automatic jump to the app.
    function returnToApp(query, text) {
      const link = RETURN_TO + '?' + new URLSearchParams(query);
      say(text);
      const back = document.getElementById('back');
      back.href = link;
      back.hidden = false;
      location.href = link;
    }

    function showPicker() {
      if (!token) {
        say('Open this page from the MyAffirmations app.');
        return;
      }
      const FOLDER = 'application/vnd.google-apps.folder';
      const DOC = 'application/vnd.google-apps.document';
      // Google's folder view (it shows where you are and moves through
      // folders), starting in folder [start]. mode=folder: folders only, one
      // can be selected (where to save). mode=doc: Google Docs inside the
      // folders, a Doc can be picked.
      function folderView(start, label) {
        const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
          .setMimeTypes(mode === 'folder' ? FOLDER : FOLDER + ',' + DOC)
          .setIncludeFolders(true)
          .setSelectFolderEnabled(mode === 'folder')
          .setParent(start)
          .setMode(google.picker.DocsViewMode.LIST);
        if (typeof view.setLabel === 'function') view.setLabel(label);
        return view;
      }
      const builder = new google.picker.PickerBuilder();
      if (mode === 'folder') {
        // A view started inside a folder can't go up out of it: a tab for the
        // remembered folder (by name), and My Drive to go anywhere.
        if (parent !== 'root') builder.addView(folderView(parent, parentName));
        builder.addView(folderView('root', 'My Drive'));
      } else {
        builder.addView(folderView('root', 'My Drive'));
        // Docs picked before (for this app), by name.
        builder.addView(new google.picker.View(google.picker.ViewId.RECENTLY_PICKED)
          .setMimeTypes(DOC));
      }
      builder
        .setOAuthToken(token)
        .setDeveloperKey(API_KEY)
        .setAppId(APP_ID)
        .setTitle(mode === 'folder' ? 'Choose a folder to save in'
                                    : 'Choose a Google Doc to import')
        .setCallback((data) => {
          const action = data[google.picker.Response.ACTION];
          if (action === google.picker.Action.PICKED) {
            const doc = data[google.picker.Response.DOCUMENTS][0];
            returnToApp({ id: doc[google.picker.Document.ID],
                          name: doc[google.picker.Document.NAME],
                          parent: doc[google.picker.Document.PARENT_ID] || '' },
                        'Got it — returning to MyAffirmations…');
          } else if (action === google.picker.Action.CANCEL) {
            returnToApp({ cancelled: '1' }, 'Cancelled — returning to MyAffirmations…');
          }
        })
        .build()
        .setVisible(true);
      say('');
    }

    function onApiLoad() { gapi.load('picker', showPicker); }
  </script>
  <script async defer src="https://apis.google.com/js/api.js" onload="onApiLoad()"></script>
</body>
</html>
